# =============================================================================
# Build and Release — triggered ONCE per tag push (v*), never on branch push.
# =============================================================================
# Design rationale (following GitHub official guidance):
#   on.push.tags        – runs ONLY when a matching tag is pushed, not on
#                         branch commits or PRs. One tag = one workflow run.
#   softprops/action-gh-release@v3 – the de-facto standard action wrapping the
#                         GitHub Releases API (successor to the deprecated
#                         actions/create-release). Node 24 runtime.
#   generate_release_notes:true – auto-generates notes from merged PRs / commits
#                         (GitHub's built-in release notes generator).
#   Updater: bundle.createUpdaterArtifacts=true 让 tauri build 自动签名安装包
#   并生成 latest.json（发布到 GitHub Release 后，
#   https://github.com/object-1ve/OopsLauncher/releases/latest/download/latest.json
#   即为应用内更新检查端点）。签名私钥来自 Secret TAURI_SIGNING_PRIVATE_KEY。
# =============================================================================

name: Build and Release

on:
  push:
    tags:
      - 'v*'            # only v-prefixed tags, e.g. v0.4.24 — one run per tag.

# ── Permissions ──────────────────────────────────────────────────────────────
permissions:
  contents: write       # required by softprops/action-gh-release to create the
                        # release and upload assets.

# ── Environment ──────────────────────────────────────────────────────────────
env:
  CARGO_TERM_COLOR: always

# ── Jobs ─────────────────────────────────────────────────────────────────────
jobs:

  # ── Build (Windows x64) ─────────────────────────────────────────────────────
  build:
    runs-on: windows-latest

    env:
      # updater 签名私钥（GitHub Secret: TAURI_SIGNING_PRIVATE_KEY）
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Rust toolchain ──────────────────────────────────────────────────
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ── Node.js + pnpm ──────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      # ── Tests ───────────────────────────────────────────────────────────
      - name: Run Rust unit tests
        run: cargo test
        working-directory: src-tauri

      # ── Build ───────────────────────────────────────────────────────────
      # createUpdaterArtifacts=true 时自动对安装包签名，生成 *.msi.sig
      - name: Build Tauri application (MSI)
        run: pnpm tbuild --bundles msi

      # ── Generate updater manifest ──────────────────────────────────────
      # latest.json 由构建生成的 .sig 与本次 tag 拼装；
      # 发布后 endpoint 固定为 releases/latest/download/latest.json
      - name: Generate updater latest.json
        shell: pwsh
        run: |
          $msi = Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          $sig = (Get-Content "$($msi.FullName).sig" -Raw).Trim()
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $url = "https://github.com/object-1ve/OopsLauncher/releases/download/${{ github.ref_name }}/$($msi.Name)"
          $json = [ordered]@{
            version  = $version
            pub_date = $pubDate
            platforms = @{
              "windows-x86_64" = @{
                signature = $sig
                url       = $url
              }
            }
          } | ConvertTo-Json -Depth 5
          Set-Content -Path "src-tauri/target/release/bundle/latest.json" -Value $json
          Get-Content "src-tauri/target/release/bundle/latest.json"

      # ── Upload build artifacts ──────────────────────────────────────────
      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: OopsLauncher-Windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/latest.json
          if-no-files-found: warn

  # ── Build (macOS ARM64) ──────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest

    env:
      # updater 签名私钥（GitHub Secret: TAURI_SIGNING_PRIVATE_KEY）
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Rust toolchain ──────────────────────────────────────────────────
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ── Node.js + pnpm ──────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      # ── Tests ───────────────────────────────────────────────────────────
      - name: Run Rust unit tests
        run: cargo test
        working-directory: src-tauri

      # ── Build ───────────────────────────────────────────────────────────
      - name: Build Tauri application (DMG)
        run: pnpm tbuild --bundles dmg

      # ── Upload build artifacts ──────────────────────────────────────────
      # 注意：不上传 macOS 的 latest.json，避免覆盖 Windows 版（updater 端点
      # 只维护 windows-x86_64 条目，macOS 端暂不提供自动更新）
      - name: Upload DMG installer
        uses: actions/upload-artifact@v4
        with:
          name: OopsLauncher-macOS
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  # ── Release (after all builds succeed) ───────────────────────────────────────
  release:
    needs: [build, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download MSI installer
        uses: actions/download-artifact@v4
        with:
          name: OopsLauncher-Windows

      - name: Download DMG installer
        uses: actions/download-artifact@v4
        with:
          name: OopsLauncher-macOS

      - name: List release assets
        run: ls -lh

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: OopsLauncher ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            *.msi
            *.msi.sig
            latest.json
            *.dmg
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: false
